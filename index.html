<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1769 TG & Box 品項更換表單</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 引入 HTML5 QR Code 掃描器 -->
  <script src="https://unpkg.com/html5-qrcode" async crossorigin="anonymous"></script>

  <!-- 自訂卷軸與實用樣式 -->
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 99px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .d-none {
      display: none !important;
    }
  </style>
</head>
<body class="min-h-screen bg-[#f8fafc] py-10 px-4 sm:px-6 lg:px-8 font-sans relative">
  
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 全新輕量化 Header -->
    <div class="pb-4 border-b border-gray-200 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight flex items-start sm:items-center gap-3">
          <i data-lucide="box" class="text-[#3643ba] w-8 h-8 shrink-0 mt-0.5 sm:mt-0"></i>
          <span class="leading-snug">
            1769 TG & Box
            <span class="text-[#3643ba] block sm:inline mt-1 sm:mt-0">品項更換表單</span>
          </span>
        </h1>
        <p class="mt-2 text-gray-500 text-sm">
          只要有增減品項都請填寫此表單，填完後也要記得更換 CubeInStore 數據唷！
        </p>
      </div>
      <div id="itemCount" class="text-sm text-gray-400 bg-white px-3 py-1.5 rounded-full border border-gray-200 shadow-sm self-start md:self-auto shrink-0">
        共 0 件商品
      </div>
    </div>

    <form id="mainForm" class="space-y-6">
      
      <!-- 區塊 1：商區設定 -->
      <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 transition-all hover:shadow-md">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2 mb-2">
          <i data-lucide="map-pin" class="text-[#3643ba] w-5 h-5"></i>
          1. 商區設定
        </h2>
        <p class="text-sm text-gray-500 mb-4">
          請選擇商區類型及編號。
        </p>
        
        <!-- 下拉式選單容器 (預設顯示) -->
        <div id="normalLocationContainer" class="flex flex-col sm:flex-row gap-3">
          <!-- 類型選擇 -->
          <select id="locType" class="px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#3643ba]/20 focus:border-[#3643ba] outline-none bg-gray-50/50 min-w-[140px]">
            <option value="">請選擇類型</option>
            <option value="TG">TG</option>
            <option value="Box">Box</option>
          </select>

          <!-- TG 專用選單 (預設隱藏) -->
          <div id="tgSelects" class="flex flex-1 gap-3 d-none">
            <select id="tgDept" class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#3643ba]/20 focus:border-[#3643ba] outline-none bg-gray-50/50">
              <option value="">選擇部門</option>
            </select>
            <span class="flex items-center text-gray-400 font-bold">-</span>
            <select id="tgNum" class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#3643ba]/20 focus:border-[#3643ba] outline-none bg-gray-50/50">
              <option value="">選擇編號</option>
            </select>
          </div>

          <!-- Box 專用選單 (預設隱藏) -->
          <div id="boxSelects" class="flex flex-1 gap-3 d-none">
            <select id="boxNum" class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#3643ba]/20 focus:border-[#3643ba] outline-none bg-gray-50/50">
              <option value="">選擇 Box 編號</option>
            </select>
          </div>
        </div>

        <!-- 手動輸入容器 (載入失敗時顯示) -->
        <div id="manualLocationContainer" class="w-full d-none">
          <input
            type="text"
            id="manualLocationInput"
            placeholder="請手動輸入商區編號，例如：C1-3 或 B20"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#3643ba]/20 focus:border-[#3643ba] outline-none transition-all bg-gray-50/50"
          />
        </div>

        <p id="dataSourceStatus" class="text-xs text-gray-400 mt-3 flex items-center gap-1">
          <i data-lucide="database" class="w-4 h-4"></i>
          目前使用系統預設編號資料
        </p>
      </div>

      <!-- 區塊 2：加入商品 -->
      <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 transition-all hover:shadow-md">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2 mb-2">
          <i data-lucide="package-plus" class="text-[#3643ba] w-5 h-5"></i>
          2. 加入商品 Model Code
        </h2>
        <p class="text-sm text-gray-500 mb-4">
          支援一次貼上多個貨號或使用相機掃描 QR Code。
        </p>
        
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            type="text"
            id="bulkInput"
            placeholder="貼上貨號，例如：8526140 8516193..."
            class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#3643ba]/20 focus:border-[#3643ba] outline-none transition-all bg-gray-50/50"
          />
          <button
            type="button"
            id="btnScan"
            class="bg-white text-gray-700 border-2 border-gray-300 hover:bg-gray-100 px-5 py-3 rounded-xl font-bold transition-colors flex items-center justify-center gap-2 shrink-0"
          >
            <i data-lucide="camera" class="w-[18px] h-[18px]"></i>
            掃描
          </button>
          <button
            type="button"
            id="btnAdd"
            class="bg-white text-[#3643ba] border-2 border-[#3643ba] hover:bg-[#3643ba] hover:text-white px-6 py-3 rounded-xl font-bold transition-colors flex items-center justify-center gap-2 shrink-0"
          >
            <i data-lucide="plus" class="w-[18px] h-[18px]"></i>
            加入
          </button>
        </div>
      </div>

      <!-- 區塊 3：預覽與確認 -->
      <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 transition-all hover:shadow-md">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2 mb-2">
          <i data-lucide="check-square" class="text-[#3643ba] w-5 h-5"></i>
          3. 預覽與確認
        </h2>
        <p class="text-sm text-gray-500 mb-4">
          左右滑動確認商品，點按圖片即可刪除。
        </p>        

        <!-- 圖片預覽區 -->
        <div class="mb-6">
          <!-- 有資料時顯示的容器 -->
          <div id="previewContainer" class="flex overflow-x-auto gap-4 pb-4 custom-scrollbar d-none">
            <!-- 圖片將由 JavaScript 動態插入於此 -->
          </div>
          
          <!-- 無資料時顯示的空白狀態 -->
          <div id="emptyState" class="py-12 bg-gray-50 border-2 border-dashed border-gray-200 rounded-xl flex flex-col items-center justify-center text-gray-400">
            <i data-lucide="image" class="w-12 h-12 mb-3 opacity-20"></i>
            <p>尚未加入任何商品</p>
          </div>
        </div>

        <!-- 最終表單資料 -->
        <div class="space-y-3 mb-8">
          <label class="block text-sm font-semibold text-gray-600">
            最終輸出格式（自動生成）
          </label>
          <textarea
            id="finalTextarea"
            readonly
            placeholder="此處將自動填入以空格隔開的商品清單..."
            class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50/80 text-gray-600 outline-none h-24 resize-none font-mono text-sm"
          ></textarea>
        </div>

        <!-- 訊息提示區 (成功/錯誤) -->
        <div id="statusMessage" class="mb-4 p-4 rounded-xl border flex items-center gap-3 d-none">
          <!-- 內容由 JS 動態填入 -->
        </div>

        <!-- 送出按鈕 -->
        <button
          type="submit"
          id="submitBtn"
          disabled
          class="w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all duration-200 bg-gray-200 text-gray-400 cursor-not-allowed"
        >
          <i data-lucide="send" class="w-5 h-5"></i>
          <span id="submitBtnText">確認無誤，送出資料</span>
        </button>
        
      </div>
    </form>
  </div>

  <!-- =============================== -->
  <!-- 掃描器 Modal 視窗 -->
  <!-- =============================== -->
  <div id="scannerModal" class="fixed inset-0 z-50 bg-black/80 flex flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity d-none">
    <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden flex flex-col shadow-2xl">
      <div class="p-4 border-b flex justify-between items-center bg-gray-50">
        <h3 class="font-bold text-gray-800 flex items-center gap-2">
          <i data-lucide="camera" class="text-[#3643ba] w-5 h-5"></i> 
          掃描商品條碼
        </h3>
        <button 
          type="button"
          id="btnCloseScanner"
          class="p-2 bg-gray-200 text-gray-600 rounded-full hover:bg-gray-300 transition-colors"
          title="關閉掃描器"
        >
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <!-- 相機預覽畫面容器 -->
      <div class="bg-black relative w-full flex justify-center items-center overflow-hidden min-h-[300px]">
        <div id="qr-reader" class="w-full"></div>
      </div>
      
      <div id="scanStatusText" class="p-4 text-sm text-center text-gray-700 bg-gray-50 font-medium break-all">
        請將相機對準商品條碼或 QR Code
      </div>
    </div>
  </div>

  <script>
    // 初始化 Lucide 圖示
    lucide.createIcons();

    // 狀態管理
    let modelCodes = [];
    let isSubmitting = false;
    let isManualLocationMode = false; // 新增：是否為手動輸入模式

    // ==========================================
    // 🔗 Google 表單送出設定區 
    // ==========================================
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfF8Wq565jbS1v6wk8_m0VNFoQn35BP34SLitRFJtpCSNYrRQ/formResponse"; 
    const ENTRY_LOCATION = "entry.795130238"; 
    const ENTRY_MODELS = "entry.1574742509";   

    // --- 商區編號設定 (Google Sheet 連結) ---
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlW93nNOC2e79n_wXpyjoLlFqE3b59yajqBRUt1qGe36yFaG7ImEsL_Nu8uJkrdI3GUuKq9Q08cTTo/pub?gid=216640336&single=true&output=csv"; 
    
    let locationConfig = {
      TG: {
        "C1": ["1", "2", "3", "4"],
        "C2": ["1", "2"],
        "C3": ["1"]
      },
      Box: ["B01", "B02", "B03", "B04", "B05"]
    };

    // DOM 元素選取
    const locTypeSelect = document.getElementById('locType');
    const tgSelects = document.getElementById('tgSelects');
    const boxSelects = document.getElementById('boxSelects');
    const tgDeptSelect = document.getElementById('tgDept');
    const tgNumSelect = document.getElementById('tgNum');
    const boxNumSelect = document.getElementById('boxNum');
    const dataSourceStatus = document.getElementById('dataSourceStatus');
    
    // 新增：手動輸入模式的 DOM 元素
    const normalLocationContainer = document.getElementById('normalLocationContainer');
    const manualLocationContainer = document.getElementById('manualLocationContainer');
    const manualLocationInput = document.getElementById('manualLocationInput');

    const bulkInput = document.getElementById('bulkInput');
    const btnAdd = document.getElementById('btnAdd');
    const btnScan = document.getElementById('btnScan');
    const previewContainer = document.getElementById('previewContainer');
    const emptyState = document.getElementById('emptyState');
    const finalTextarea = document.getElementById('finalTextarea');
    const itemCount = document.getElementById('itemCount');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const statusMessage = document.getElementById('statusMessage');
    const mainForm = document.getElementById('mainForm');

    // 掃描器 DOM 與狀態
    const scannerModal = document.getElementById('scannerModal');
    const btnCloseScanner = document.getElementById('btnCloseScanner');
    const scanStatusText = document.getElementById('scanStatusText');
    let html5QrCodeScanner = null;
    let isStartingScanner = false;

    // 顯示狀態提示訊息
    function showMessage(type, text) {
      statusMessage.classList.remove('d-none');
      if (type === 'success') {
        statusMessage.className = 'mb-4 p-4 bg-green-50 text-green-700 rounded-xl border border-green-200 flex items-center gap-3';
        statusMessage.innerHTML = `<div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></div><span class="font-medium">${text}</span>`;
      } else {
        statusMessage.className = 'mb-4 p-4 bg-red-50 text-red-700 rounded-xl border border-red-200 flex items-center gap-3';
        statusMessage.innerHTML = `<i data-lucide="alert-circle" class="w-5 h-5 text-red-500 shrink-0"></i><span class="font-medium">${text}</span>`;
        lucide.createIcons();
      }
      
      setTimeout(() => {
        statusMessage.classList.add('d-none');
      }, 8000);
    }

    // 更新畫面
    function updateUI() {
      itemCount.innerText = `共 ${modelCodes.length} 件商品`;
      finalTextarea.value = modelCodes.join(' ');

      if (modelCodes.length > 0) {
        emptyState.classList.add('d-none');
        previewContainer.classList.remove('d-none');
        previewContainer.innerHTML = '';
        
        modelCodes.forEach(code => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'relative group shrink-0';
          itemDiv.innerHTML = `
            <div class="w-36 h-36 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative">
              <img 
                src="https://product-picture.decathlon.cn/model/${code}.jpg?f=500"
                alt="Model ${code}"
                onerror="this.src='https://via.placeholder.com/150x150.png?text=No+Image'"
                class="w-full h-full object-cover p-2"
              />
              <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                <button
                  type="button"
                  onclick="handleDelete('${code}')"
                  class="bg-red-500 text-white p-2.5 rounded-full hover:bg-red-600 transform hover:scale-110 transition-all shadow-lg"
                  title="移除此商品"
                >
                  <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
            <div class="text-center mt-3 text-sm font-bold text-gray-700">
              ${code}
            </div>
          `;
          previewContainer.appendChild(itemDiv);
        });
        lucide.createIcons();
      } else {
        emptyState.classList.remove('d-none');
        previewContainer.classList.add('d-none');
      }
      checkSubmitButtonState();
    }

    // 取得當前選擇的完整商區編號
    function getSelectedLocation() {
      // 若為手動模式，直接回傳輸入框的值
      if (isManualLocationMode) {
        return manualLocationInput.value.trim();
      }

      const type = locTypeSelect.value;
      if (type === 'TG') {
        const dept = tgDeptSelect.value;
        const num = tgNumSelect.value;
        if (dept && num) return `${dept}-${num}`;
      } else if (type === 'Box') {
        const box = boxNumSelect.value;
        if (box) return box;
      }
      return '';
    }

    // 檢查並切換送出按鈕的樣式與狀態
    function checkSubmitButtonState() {
      const isLocFilled = getSelectedLocation() !== '';
      const hasModels = modelCodes.length > 0;
      const isDisabled = isSubmitting || !hasModels || !isLocFilled;

      submitBtn.disabled = isDisabled;

      if (isDisabled) {
        submitBtn.className = "w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all duration-200 bg-gray-200 text-gray-400 cursor-not-allowed";
      } else {
        submitBtn.className = "w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all duration-200 bg-[#3643ba] text-white hover:bg-blue-800 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5";
      }
    }

    // ==========================================
    // 📷 相機掃描器相關邏輯
    // ==========================================
    function openScannerModal() {
      if (typeof Html5Qrcode === "undefined") {
        showMessage('error', '相機模組仍在載入中，請稍後再試。');
        return;
      }
      scanStatusText.innerText = "請將相機對準商品條碼或 QR Code";
      scannerModal.classList.remove('d-none');
      
      // 稍微延遲以確保 Modal 中的 DOM 渲染完畢
      setTimeout(startScanning, 150);
    }

    async function startScanning() {
      try {
        if (!html5QrCodeScanner) {
          html5QrCodeScanner = new Html5Qrcode("qr-reader");
        }
        isStartingScanner = true;

        await html5QrCodeScanner.start(
          { facingMode: "environment" }, // 優先使用手機後置鏡頭
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            // 使用 Regex 擷取網址裡的 6~8 碼數字 (Model Code)
            const match = decodedText.match(/\d{6,8}/);
            if (match) {
              const modelCode = match[0];
              if (!modelCodes.includes(modelCode)) {
                modelCodes.push(modelCode);
                updateUI();
              }
              scanStatusText.innerText = `成功加入貨號: ${modelCode}`;
              // 抓到後自動關閉掃描視窗
              stopAndCloseScanner();
            } else {
              // 掃描到東西但不是我們要的貨號格式
              scanStatusText.innerText = `無法辨識貨號，目前掃描到: ${decodedText.substring(0, 15)}...`;
            }
          },
          (ignoreError) => {
            // 忽略掃描過程中的背景錯誤
          }
        );
        isStartingScanner = false;
      } catch (err) {
        console.error("相機啟動失敗", err);
        isStartingScanner = false;
        showMessage('error', '無法啟動相機！請確認已允許瀏覽器使用相機權限。');
        scannerModal.classList.add('d-none');
      }
    }

    async function stopAndCloseScanner() {
      // 如果相機還在「啟動中」的狀態，延遲一下再關閉，避免 library 崩潰
      if (isStartingScanner) {
        setTimeout(stopAndCloseScanner, 300);
        return;
      }

      if (html5QrCodeScanner) {
        try {
          await html5QrCodeScanner.stop();
          html5QrCodeScanner.clear();
        } catch (e) {
          console.error("相機停止失敗", e);
        }
      }
      scannerModal.classList.add('d-none');
    }

    // 綁定掃描按鈕事件
    btnScan.addEventListener('click', openScannerModal);
    btnCloseScanner.addEventListener('click', stopAndCloseScanner);

    // ==========================================
    // 處理批量新增與手動輸入
    // ==========================================
    function handleAddModels() {
      const val = bulkInput.value;
      if (!val.trim()) return;

      const cleanedInput = val.replace(/[,，。;；\n]/g, ' ');
      const newCodes = cleanedInput.split(/\s+/).filter(code => code.trim() !== '');

      const uniqueInputCodes = [...new Set(newCodes)];
      const finalCodesToAdd = uniqueInputCodes.filter(code => !modelCodes.includes(code));
      
      if (finalCodesToAdd.length > 0) {
        modelCodes = [...modelCodes, ...finalCodesToAdd];
        updateUI();
      }
      
      bulkInput.value = '';
    }

    // 全域刪除方法
    window.handleDelete = function(codeToRemove) {
      modelCodes = modelCodes.filter(code => code !== codeToRemove);
      updateUI();
    };

    // 事件監聽綁定
    btnAdd.addEventListener('click', handleAddModels);

    bulkInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleAddModels();
      }
    });

    locTypeSelect.addEventListener('change', function(e) {
      const val = e.target.value;
      tgSelects.classList.add('d-none');
      boxSelects.classList.add('d-none');
      
      if (val === 'TG') tgSelects.classList.remove('d-none');
      if (val === 'Box') boxSelects.classList.remove('d-none');
      
      checkSubmitButtonState();
    });

    tgDeptSelect.addEventListener('change', function(e) {
      const dept = e.target.value;
      tgNumSelect.innerHTML = '<option value="">選擇編號</option>';
      if (dept && locationConfig.TG[dept]) {
        locationConfig.TG[dept].forEach(num => {
          tgNumSelect.innerHTML += `<option value="${num}">${num}</option>`;
        });
      }
      checkSubmitButtonState();
    });

    tgNumSelect.addEventListener('change', checkSubmitButtonState);
    boxNumSelect.addEventListener('change', checkSubmitButtonState);
    
    // 新增：手動輸入框的事件監聽
    manualLocationInput.addEventListener('input', checkSubmitButtonState);

    mainForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const finalLocation = getSelectedLocation();
      if (!finalLocation) {
        showMessage('error', '請完整選擇區域與編號！');
        return;
      }

      isSubmitting = true;
      checkSubmitButtonState();
      submitBtnText.innerText = '處理中...';

      if (!GOOGLE_FORM_URL) {
        setTimeout(() => {
          isSubmitting = false;
          checkSubmitButtonState();
          submitBtnText.innerText = '確認無誤，送出資料';
          showMessage('success', `【模擬測試】資料已準備送出！(區域: ${finalLocation})`);
        }, 1000);
        return;
      }

      // --- 實際送出資料到 Google 表單 ---
      const formData = new URLSearchParams();
      formData.append(ENTRY_LOCATION, finalLocation);
      formData.append(ENTRY_MODELS, modelCodes.join(' '));

      fetch(GOOGLE_FORM_URL, {
        method: 'POST',
        mode: 'no-cors', 
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData.toString()
      }).then(() => {
        isSubmitting = false;
        checkSubmitButtonState();
        submitBtnText.innerText = '確認無誤，送出資料';
        
        modelCodes = [];
        updateUI();
        
        showMessage('success', '資料已成功送出至系統！');
      }).catch((error) => {
        isSubmitting = false;
        checkSubmitButtonState();
        submitBtnText.innerText = '確認無誤，送出資料';
        
        showMessage('error', '傳送失敗，請檢查網路連線或表單設定。');
        console.error("Form Submit Error:", error);
      });
    });

    // --- 初始化選單與讀取 Google Sheet ---
    function initDropdowns() {
      tgDeptSelect.innerHTML = '<option value="">選擇部門</option>';
      Object.keys(locationConfig.TG).forEach(dept => {
        tgDeptSelect.innerHTML += `<option value="${dept}">${dept}</option>`;
      });

      boxNumSelect.innerHTML = '<option value="">選擇 Box 編號</option>';
      locationConfig.Box.forEach(box => {
        boxNumSelect.innerHTML += `<option value="${box}">${box}</option>`;
      });
    }

    async function loadConfig() {
      if (!GOOGLE_SHEET_CSV_URL) {
        initDropdowns();
        return;
      }
      
      dataSourceStatus.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>正在同步後台資料...`;
      dataSourceStatus.className = "text-xs mt-3 flex items-center gap-1 text-blue-500 font-bold";
      lucide.createIcons();
      
      try {
        let fetchUrl = GOOGLE_SHEET_CSV_URL;
        if (fetchUrl.includes('/pubhtml')) {
            fetchUrl = fetchUrl.replace('/pubhtml', '/pub');
            fetchUrl += fetchUrl.includes('?') ? '&output=csv' : '?output=csv';
        }

        let csvText = '';

        try {
            const res = await fetch(fetchUrl);
            if (!res.ok) throw new Error("CORS or Server Error");
            csvText = await res.text();
        } catch (directError) {
            console.warn("直接讀取被阻擋，嘗試使用 Proxy 代理伺服器...", directError);
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(fetchUrl)}`;
            const proxyRes = await fetch(proxyUrl);
            if (!proxyRes.ok) throw new Error("Proxy Fetch Failed");
            csvText = await proxyRes.text();
        }
        
        if (csvText.trim().toLowerCase().startsWith('<!doctype html>')) {
            throw new Error("AUTH_ERROR");
        }

        const rows = csvText.split('\n').map(row => row.trim().split(','));
        const newConfig = { TG: {}, Box: [] };
        
        for (let i = 1; i < rows.length; i++) {
          if (!rows[i] || rows[i].length < 1) continue;
          
          const type = rows[i][0] ? rows[i][0].replace(/['"]/g, '') : '';
          const dept = rows[i][1] ? rows[i][1].replace(/['"]/g, '') : '';
          const num = rows[i][2] ? rows[i][2].replace(/['"]/g, '') : '';
          
          if (!type) continue;
          
          if (type.toUpperCase() === 'TG' && dept && num) {
            if (!newConfig.TG[dept]) newConfig.TG[dept] = [];
            newConfig.TG[dept].push(num);
          } else if (type.toUpperCase() === 'BOX' && num) {
            newConfig.Box.push(num);
          }
        }
        
        if (Object.keys(newConfig.TG).length > 0 || newConfig.Box.length > 0) {
            locationConfig = newConfig;
            dataSourceStatus.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i>已成功載入最新編號清單`;
            dataSourceStatus.className = "text-xs mt-3 flex items-center gap-1 text-green-600 font-bold";
        } else {
            throw new Error("FORMAT_ERROR");
        }
      } catch (err) {
        console.warn("載入失敗:", err.message);
        
        if (err.message === "AUTH_ERROR") {
          dataSourceStatus.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4"></i>讀取失敗：權限非公開，已自動切換為手動輸入`;
        } else {
          dataSourceStatus.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4"></i>網路異常或資料錯誤，已自動切換為手動輸入`;
        }
        
        dataSourceStatus.className = "text-xs mt-3 flex items-center gap-1 text-red-500 font-bold";
        
        // --- 觸發手動輸入模式 ---
        isManualLocationMode = true;
        normalLocationContainer.classList.add('d-none');
        manualLocationContainer.classList.remove('d-none');
        checkSubmitButtonState();
      }
      
      lucide.createIcons();
      // 只有在非手動模式才需要初始化選單
      if (!isManualLocationMode) {
        initDropdowns();
      }
    }

    // 初始渲染
    updateUI();
    loadConfig();
  </script>
</body>
</html>
